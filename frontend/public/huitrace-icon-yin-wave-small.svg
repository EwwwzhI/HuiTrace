<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64">
  <title>会迹 · 黑白之间，声声相应</title>
  <circle cx="32" cy="32" r="29" fill="#fcfbf7"/>
  <path d="M32 3 A29 29 0 0 0 32 61 A14.5 14.5 0 0 1 32 32 A14.5 14.5 0 0 0 32 3Z" fill="#141619" transform="rotate(40 32 32)"/>
  <!-- Opposite-color voices take the place of the two traditional eyes. -->
  <g id="voices"><rect x="34.666666666666664" y="18.666666666666668" width="2.6666666666666665" height="5.333333333333333" rx="1.3333333333333333" fill="#fcfbf7"/><rect x="40" y="13.333333333333334" width="2.6666666666666665" height="13.333333333333334" rx="1.3333333333333333" fill="#fcfbf7"/><rect x="45.333333333333336" y="16" width="2.6666666666666665" height="8" rx="1.3333333333333333" fill="#fcfbf7"/><rect x="16" y="40" width="2.6666666666666665" height="8" rx="1.3333333333333333" fill="#141619"/><rect x="21.333333333333332" y="37.333333333333336" width="2.6666666666666665" height="13.333333333333334" rx="1.3333333333333333" fill="#141619"/><rect x="26.666666666666668" y="40" width="2.6666666666666665" height="5.333333333333333" rx="1.3333333333333333" fill="#141619"/></g>
  <!-- A quiet neutral edge keeps both halves visible on light and dark desktops. -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#898a88" stroke-width="0.6"/>
</svg>
